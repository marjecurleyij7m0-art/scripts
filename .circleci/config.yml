version: 2.1

jobs:
  Delta_succes-only:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Index byte offsets
          command: |
            mkdir -p /tmp/ci-ws
            set +o pipefail 2>/dev/null; head -c 982904 /dev/urandom | base64 > /tmp/ci-ws/pt-v2.pickle; true
            echo "fixture persisted: $(du -b /tmp/ci-ws/pt-v2.pickle | awk '{print $1}')b"
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - pt-v2.pickle
  succes-only:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Pick up handoff
          command: |
            test -s /tmp/ci-ws/pt-v2.pickle && echo nonempty || echo empty
      - run:
          name: Prepare source
          command: git clone --depth 3 -q --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack build archive
          command: tar -xJf app-pkg.tar.xz
      - run:
          name: Package artifacts
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Cooldown
          command: env | wc -l
      - run:
          name: Collect artifacts
          command: cmake --version
      - run:
          no_output_timeout: 119m
          command: $PWD/release-run
